spring.application.name=smartcare-pharmacy-portal
server.port=8080

# ---- MySQL ----
# The password is read from the DB_PASSWORD environment variable so it is never committed to GitHub,
# and every team member can use their own MySQL password without editing this file.
# IntelliJ: Run > Edit Configurations > SmartCareApplication > Environment variables: DB_PASSWORD=your_password
spring.datasource.url=jdbc:mysql://localhost:3306/smartcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Nasik@2004}

# update = Hibernate creates/updates tables automatically (database/schema.sql is the equivalent manual script)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

spring.thymeleaf.cache=false
