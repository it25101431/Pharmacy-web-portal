<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Supplier Report')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments :: flash}"></div>
    <h3>Supplier Performance</h3>
    <div class="table-responsive"><table class="table bg-white align-middle">
        <thead><tr><th>Supplier</th><th>Purchase orders</th><th>Delivered</th><th>Delivered on time</th><th>Out-of-stock</th><th>On-time rate</th></tr></thead>
        <tbody><tr th:if="${stats.empty}"><td colspan="6" class="text-center text-muted">No suppliers yet.</td></tr>
        <tr th:each="s : ${stats}"><td th:text="${s.supplier.fullName}"></td><td th:text="${s.total}"></td><td th:text="${s.delivered}"></td><td th:text="${s.onTime}"></td><td th:text="${s.outOfStock}"></td>
            <td style="min-width:160px"><div class="progress"><div class="progress-bar bg-success" th:style="'width:' + ${s.rate} + '%'" th:text="${s.rate} + '%'"></div></div></td></tr></tbody></table></div>
    <p class="text-muted small">On-time rate = deliveries confirmed on or before the purchase-order due date (7 days) divided by all delivered orders.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
