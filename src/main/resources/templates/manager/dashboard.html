<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments :: flash}"></div>
    <h3>Store Dashboard</h3>
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card card-body"><div class="text-muted small">Today's revenue (LKR)</div><div class="fs-4" th:text="${#numbers.formatDecimal(todayRevenue,1,'COMMA',2,'POINT')}"></div><div class="text-muted" style="font-size:.78rem">paid only &middot; order value <span th:text="${#numbers.formatDecimal(todayOrderValue,1,'COMMA',2,'POINT')}"></span></div></div></div>
        <div class="col-6 col-lg-3"><div class="card card-body"><div class="text-muted small">Orders today</div><div class="fs-4" th:text="${todayOrders}"></div></div></div>
        <div class="col-6 col-lg-3"><div class="card card-body"><div class="text-muted small">Total revenue (LKR)</div><div class="fs-4" th:text="${#numbers.formatDecimal(totalRevenue,1,'COMMA',2,'POINT')}"></div><div class="text-muted" style="font-size:.78rem">paid only &middot; order value <span th:text="${#numbers.formatDecimal(totalOrderValue,1,'COMMA',2,'POINT')}"></span></div></div></div>
        <div class="col-6 col-lg-3"><div class="card card-body"><div class="text-muted small">Total orders</div><div class="fs-4" th:text="${totalOrders}"></div></div></div>
        <div class="col-6 col-lg-3"><a class="text-decoration-none" th:href="@{/manager/alerts}"><div class="card card-body border-warning"><div class="text-muted small">Low-stock items</div><div class="fs-4 text-warning" th:text="${lowStockCount}"></div></div></a></div>
        <div class="col-6 col-lg-3"><a class="text-decoration-none" th:href="@{/manager/purchase-orders}"><div class="card card-body"><div class="text-muted small">Open purchase orders</div><div class="fs-4" th:text="${openPos}"></div></div></a></div>
    </div>
    <div class="row g-3">
        <div class="col-lg-8"><div class="card card-body"><h6>Revenue - last 7 days <small class="text-muted fw-normal">(paid orders only)</small></h6><canvas id="rev" height="120"></canvas></div></div>
        <div class="col-lg-4"><div class="card card-body"><h6>Orders by status</h6>
            <ul class="list-group list-group-flush"><li class="list-group-item d-flex justify-content-between" th:each="e : ${byStatus}"><span th:text="${e.key}"></span><span class="badge bg-secondary" th:text="${e.value}"></span></li></ul></div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        new Chart(document.getElementById('rev'), {type: 'bar',
          data: {labels: /*[[${labels}]]*/ [], datasets: [{label: 'Paid revenue (LKR)', data: /*[[${values}]]*/ [], backgroundColor: '#198754'}]},
          options: {plugins: {legend: {display: false}}}});
    </script>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
