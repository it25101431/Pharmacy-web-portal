<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Alerts')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
<div th:replace="~{fragments :: flash}"></div>
<h3>Alerts</h3>
<h5 class="mt-3">Expired &amp; near-expiry medicines (next 30 days)</h5>
<div class="table-responsive"><table class="table bg-white">
  <thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Stock</th><th></th></tr></thead>
  <tbody><tr th:if="${expiring.empty}"><td colspan="5" class="text-muted text-center">No expiry alerts.</td></tr>
  <tr th:each="m : ${expiring}" th:classappend="${m.expired} ? 'table-danger' : 'table-warning'">
    <td th:text="${m.name}"></td><td th:text="${m.batchNo}"></td><td th:text="${m.expiryDate}"></td><td th:text="${m.stock}"></td>
    <td><span class="badge bg-danger" th:if="${m.expired}">Expired - remove from inventory</span><span class="badge bg-warning text-dark" th:unless="${m.expired}">Expires soon</span>
      <form class="d-inline" th:if="${m.expired}" method="post" th:action="@{/pharmacist/medicines/{id}/delete(id=${m.id})}"><button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr></tbody></table></div>
<h5 class="mt-4">Low stock</h5>
<div class="table-responsive"><table class="table bg-white">
  <thead><tr><th>Medicine</th><th>Stock</th><th>Reorder level</th></tr></thead>
  <tbody><tr th:if="${lowStock.empty}"><td colspan="3" class="text-muted text-center">Stock levels are healthy.</td></tr>
  <tr th:each="m : ${lowStock}"><td th:text="${m.name}"></td><td th:text="${m.stock}"></td><td th:text="${m.reorderLevel}"></td></tr></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
