<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
<div th:replace="~{fragments :: flash}"></div>
<h3>Orders</h3>
<h5 class="mt-3">Ready to pack</h5>
<div class="table-responsive"><table class="table bg-white align-middle">
  <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th></th></tr></thead>
  <tbody><tr th:if="${verified.empty}"><td colspan="5" class="text-muted text-center">Nothing to pack.</td></tr>
  <tr th:each="o : ${verified}"><td th:text="'#' + ${o.id}"></td><td th:text="${o.customer.fullName}"></td>
    <td><div th:each="i : ${o.items}" th:text="${i.medicine.name} + ' x ' + ${i.quantity}"></div></td>
    <td th:text="${#numbers.formatDecimal(o.total,1,'COMMA',2,'POINT')}"></td>
    <td><form method="post" th:action="@{/pharmacist/orders/{id}/pack(id=${o.id})}"><button class="btn btn-sm btn-success">Mark packed</button></form></td></tr></tbody></table></div>
<h5 class="mt-4">Waiting for prescription approval</h5>
<div class="table-responsive"><table class="table bg-white">
  <thead><tr><th>Order</th><th>Customer</th><th>Prescription</th></tr></thead>
  <tbody><tr th:if="${waiting.empty}"><td colspan="3" class="text-muted text-center">None.</td></tr>
  <tr th:each="o : ${waiting}"><td th:text="'#' + ${o.id}"></td><td th:text="${o.customer.fullName}"></td><td th:text="'#' + ${o.prescription.id}"></td></tr></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
