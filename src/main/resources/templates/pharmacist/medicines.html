<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Medicines')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
<div th:replace="~{fragments :: flash}"></div>
<div class="sc-head"><div><h3>Medicines</h3><p>Rows in yellow are low on stock; rows in red have expired.</p></div>
  <a class="btn btn-success" th:href="@{/pharmacist/medicines/new}"><i class="bi bi-plus-lg"></i> Add medicine</a></div>
<form class="row g-2 mb-3" method="get" th:action="@{/pharmacist/medicines}">
  <div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Search by name or generic name"></div>
  <div class="col-md-2"><button class="btn btn-outline-success"><i class="bi bi-search"></i> Search</button></div></form>
<div class="table-responsive"><table class="table table-sm align-middle">
  <thead><tr><th>Name</th><th>Category</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Price</th><th>Rx</th><th>Receive stock</th><th></th></tr></thead>
  <tbody>
    <tr th:if="${meds.empty}"><td colspan="9" class="text-center text-muted">No medicines found.</td></tr>
    <tr th:each="m : ${meds}" th:classappend="${m.expired} ? 'table-danger' : (${m.lowStock} ? 'table-warning' : '')">
      <td><div class="d-flex align-items-center gap-2">
        <span class="sc-thumb" th:classappend="${m.tone}">
          <img th:if="${m.imageFile != null}" class="photo" th:src="@{/images/medicines/{id}(id=${m.id})}" alt="">
          <img th:unless="${m.imageFile != null}" class="art" th:src="@{/img/packs/{a}.svg(a=${m.artwork})}" alt=""></span>
        <div style="min-width:10rem"><strong th:text="${m.name}"></strong><div class="small text-muted" th:text="${m.genericName}"></div></div></div></td>
      <td th:text="${m.category}"></td><td class="text-nowrap" th:text="${m.batchNo}"></td>
      <td class="text-nowrap"><span th:text="${m.expiryDate}"></span> <div><span class="badge bg-danger" th:if="${m.expired}">Expired</span><span class="badge bg-warning text-dark" th:if="${m.nearExpiry}">Expires soon</span></div></td>
      <td><span th:text="${m.stock}"></span> <span class="badge bg-warning text-dark" th:if="${m.lowStock}">Low</span></td>
      <td th:text="${#numbers.formatDecimal(m.price,1,'COMMA',2,'POINT')}"></td>
      <td><span th:if="${m.prescriptionRequired}">Yes</span></td>
      <td><form class="sc-receive" method="post" th:action="@{/pharmacist/medicines/{id}/stock(id=${m.id})}">
        <input type="number" name="qty" min="1" placeholder="Qty" class="form-control form-control-sm" th:aria-label="'Quantity received of ' + ${m.name}" required>
        <input name="batchNo" placeholder="New batch no." class="form-control form-control-sm" aria-label="New batch number (optional)">
        <input type="date" name="expiryDate" class="form-control form-control-sm" aria-label="New expiry date (optional)">
        <button class="btn btn-sm btn-outline-primary">Add</button></form></td>
      <td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary sc-icon" th:href="@{/pharmacist/medicines/{id}/edit(id=${m.id})}" th:title="'Edit ' + ${m.name}" th:aria-label="'Edit ' + ${m.name}"><i class="bi bi-pencil"></i></a>
        <form class="d-inline" method="post" th:action="@{/pharmacist/medicines/{id}/delete(id=${m.id})}" onsubmit="return confirm('Remove this medicine from the catalog?')"><button class="btn btn-sm btn-outline-danger sc-icon" th:title="'Remove ' + ${m.name}" th:aria-label="'Remove ' + ${m.name}"><i class="bi bi-trash"></i></button></form></td>
    </tr></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
