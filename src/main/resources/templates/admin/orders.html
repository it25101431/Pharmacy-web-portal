<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
<div th:replace="~{fragments :: flash}"></div>
<h3>Orders &amp; Delivery Assignment</h3>
<div class="table-responsive"><table class="table bg-white align-middle">
  <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Delivery</th><th>Assign delivery staff</th></tr></thead>
  <tbody><tr th:each="o : ${items}">
    <td th:text="'#' + ${o.id}"></td><td th:text="${o.customer.fullName}"></td>
    <td th:text="${#numbers.formatDecimal(o.total,1,'COMMA',2,'POINT')}"></td>
    <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
    <td><div th:text="${o.deliveryStatus}"></div><div class="small" th:if="${o.deliveryStaff != null}" th:text="${o.deliveryStaff.fullName}"></div>
        <div class="small text-danger" th:if="${o.deliveryIssue != null}" th:text="'Issue: ' + ${o.deliveryIssue}"></div></td>
    <td><form class="d-flex gap-1" method="post" th:action="@{/admin/orders/{id}/assign(id=${o.id})}"
              th:if="${o.status.name() == 'PACKED' or (o.status.name() == 'DISPATCHED' and o.deliveryStatus.name() == 'ISSUE')}">
      <select name="staffId" class="form-select form-select-sm" required><option value="">Select...</option><option th:each="s : ${staff}" th:value="${s.id}" th:text="${s.fullName}"></option></select>
      <button class="btn btn-sm btn-success">Assign</button></form></td></tr></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
