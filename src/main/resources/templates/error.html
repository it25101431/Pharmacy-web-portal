<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | SmartCare Pharmacy</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width:640px">
  <h2>Sorry, that page could not be shown</h2>
  <p class="text-muted">Error <strong th:text="${status}">500</strong> <span th:text="${error}"></span></p>
  <div class="alert alert-warning" th:if="${message != null and !message.isEmpty()}" th:text="${message}"></div>
  <p class="small text-muted">Path: <span th:text="${path}"></span></p>
  <a class="btn btn-primary" th:href="@{/home}">Back to my dashboard</a>
  <a class="btn btn-outline-secondary" href="javascript:location.reload()">Try again</a>
</main>
</body>
</html>
