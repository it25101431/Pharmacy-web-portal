<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3"><h3>Notifications</h3>
        <form method="post" th:action="@{/notifications/read}"><button class="btn btn-outline-secondary btn-sm">Mark all as read</button></form></div>
    <div th:if="${items.empty}" class="alert alert-info">No notifications yet.</div>
    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between" th:each="n : ${items}" th:classappend="${!n.seen} ? 'list-group-item-warning'">
            <span th:text="${n.message}"></span><small class="text-muted" th:text="${#temporals.format(n.createdAt,'dd MMM HH:mm')}"></small></li>
    </ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
